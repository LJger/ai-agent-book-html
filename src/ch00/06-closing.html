<section class="slide" id="c00-sum" data-part="6" data-dur="12000" data-title="引言小结" data-notes="引言回答了五个问题。<br>① 这本书从哪里来：以图灵《AI Agent 实战营》的课程讲义和配套实验为基础，经过系统整理、补充与重构而成；成书过程本身采用 whisper coding，记录了一种由 Agent 深度参与的知识生产方式。<br>② 原则从哪里来：来自 Pine 这类长流程、高风险的真实业务——实践在前，命名在后；要更早识别并解决问题，需要两个关键条件：选择对 Agent 能力上限提出足够高要求的真实业务并持续获取真实反馈，以及建立系统的评估机制。<br>③ 原则是什么：Agent = LLM + 上下文 + 工具，也就是大脑 + 眼睛 + 手脚，或者策略 + 观察空间 + 动作空间——三种说法对应同一个对象。<br>④ 十章怎样组织：第一至六章“如何构建 Agent”，第七至十章“如何提升 Agent 能力”，从模型参数、单体系统和群体系统三个层面扩展能力。<br>⑤ 怎样读：按身份选择阅读路径，动手跑实验，前置知识有所欠缺也不必却步。<br>Agent 技术仍在快速演进，但<b>好的架构设计原则具有穿越时间的力量</b>。掌握了“为什么要这样设计”，你就能在技术浪潮的变化中保持清醒的判断力。希望这本书能成为你构建 AI Agent 的可靠指南。<br>背景里流动的是时间，卡片保持不动；点击任一卡片回到对应部分。">

    s.querySelectorAll('.sm-c').forEach((c) => c.addEventListener('click', () => C00.jump(this.K[+c.dataset.i].p)));
    this.g = s.querySelector('.sm-cv').getContext('2d');
    const rnd = U.rand(9);
    this.P = Array.from({ length: 150 }, () => ({ x: rnd() * 1660, y: rnd() * 520, v: 0.8 + rnd() * 2.6, r: 0.6 + rnd() * 1.6, h: rnd() }));
  },
  enter(s, ctx) {
    const cards = [...s.querySelectorAll('.sm-c')];
    let j = 0;
    ctx.later(() => cards[0].classList.add('on'), 1200);
    ctx.every(() => { j = (j + 1) % cards.length; cards.forEach((c, i) => c.classList.toggle('on', i === j)); }, 2400);
    // 背景：一条从左向右流动的“时间之河”
    const g = this.g;
    ctx.raf(() => {
      g.setTransform(2, 0, 0, 2, 0, 0);
      g.clearRect(0, 0, 1660, 520);
      for (const p of this.P) {
        p.x += p.v;
        if (p.x > 1680) { p.x = -20; p.y = Math.random() * 520; }
        const col = p.h < 0.5 ? '125,211,252' : '165,180,252', a = 0.25 + p.v / 6;
        const gr = g.createLinearGradient(p.x - p.v * 14, p.y, p.x, p.y);
        gr.addColorStop(0, `rgba(${col},0)`); gr.addColorStop(1, `rgba(${col},${a.toFixed(2)})`);
        g.strokeStyle = gr; g.lineWidth = p.r * 1.4;
        g.beginPath(); g.moveTo(p.x - p.v * 14, p.y); g.lineTo(p.x, p.y); g.stroke();
      }
    });
  },
  reset(s) { s.querySelectorAll('.sm-c').forEach((c) => c.classList.remove('on')); },
};
</script>
