<script>
HOOKS['c00-cover'] = {
  CH: [['01', '入门'], ['02', '上下文'], ['03', '记忆'], ['04', '工具'], ['05', 'Coding'], ['06', '交互'], ['07', '评估'], ['08', '后训练'], ['09', '进化'], ['10', '协作']],
  init(s) {
    const S = 720, c = 360, R = 270, f = (n) => n.toFixed(1);
    const P = (a, r) => [c + r * Math.cos((a * Math.PI) / 180), c + r * Math.sin((a * Math.PI) / 180)];
    const arc = (a1, a2, r) => { const [x1, y1] = P(a1, r), [x2, y2] = P(a2, r); return `M${f(x1)} ${f(y1)}A${r} ${r} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${f(x2)} ${f(y2)}`; };
    const sec = (a1, a2, r) => { const [x1, y1] = P(a1, r), [x2, y2] = P(a2, r); return `M${c} ${c}L${f(x1)} ${f(y1)}A${r} ${r} 0 0 1 ${f(x2)} ${f(y2)}Z`; };
    let h = `<svg class="c0cv-svg" viewBox="0 0 ${S} ${S}" width="${S}" height="${S}"><defs>
      <linearGradient id="c0cv-bg" gradientUnits="userSpaceOnUse" x1="${c}" y1="${c}" x2="${c + R + 30}" y2="${c}"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset="1" stop-color="#7dd3fc" stop-opacity=".85"/></linearGradient>

    h += `<circle class="c0cv-r0" cx="${c}" cy="${c}" r="344"/><circle class="c0cv-r1" cx="${c}" cy="${c}" r="${R}"/><circle class="c0cv-r2" cx="${c}" cy="${c}" r="168"/>`;
    h += `<path class="c0cv-arc" style="--c:#22d3ee" d="${arc(-90, 90, R)}"/><path class="c0cv-arc" style="--c:#a78bfa" d="${arc(126, 234, R)}"/>`;
    // 扫描光束：领头扇区最亮，后面三段逐渐变淡
    h += `<g class="c0cv-beam" transform="rotate(-90 ${c} ${c})">` + [[-10, 4, 0.55], [-22, -10, 0.3], [-34, -22, 0.15], [-46, -34, 0.06]].map(([a1, a2, o]) => `<path class="c0cv-sec" d="${sec(a1, a2, R + 26)}" opacity="${o}"/>`).join('') + '</g>';
    this.CH.forEach(([no, t], i) => {
      const a = -90 + i * 36, [x, y] = P(a, R), [lx, ly] = P(a, R + 50), co = Math.cos((a * Math.PI) / 180), col = i < 6 ? '#22d3ee' : '#a78bfa';
      const an = co > 0.3 ? 'start' : co < -0.3 ? 'end' : 'middle';
      h += `<g class="c0cv-bd" data-k="${i}" style="--c:${col}" transform="translate(${f(x)} ${f(y)})"><g class="c0cv-bp" style="--i:${i}"><g class="c0cv-bi"><circle class="c0cv-bc" r="25"/><text class="c0cv-bn">${no}</text></g></g></g>`;
      h += `<text class="c0cv-bl" style="--c:${col}" x="${f(lx)}" y="${f(ly)}" text-anchor="${an}">${t}</text>`;
    });
    [['LLM', '#a78bfa'], ['上下文', '#22d3ee'], ['工具', '#fbbf24']].forEach(([t, col], j) => {
      const [x, y] = P(-90 + j * 120, 168);
      h += `<g class="c0cv-nd" style="--c:${col}" transform="translate(${f(x)} ${f(y)})"><circle r="38"/><text>${t}</text></g>`;

    h += `<text class="c0cv-leg" x="${c}" y="${S + 34}">右半圈 · 如何构建 Agent　　左半圈 · 如何提升 Agent 能力</text>`;
    s.querySelector('.c0cv-dial').innerHTML = h + '</svg>';
    this.beam = s.querySelector('.c0cv-beam');
    this.bds = [...s.querySelectorAll('.c0cv-bd')];
    this.lbs = [...s.querySelectorAll('.c0cv-bl')];
    this.nds = [...s.querySelectorAll('.c0cv-nd')];

  enter(s, ctx) {

      this.bds.forEach((b, i) => {
        const d = Math.abs(((((-90 + i * 36 - th) % 360) + 540) % 360) - 180), hot = d < 13;

      });
      this.nds.forEach((n, j) => {
        const a = ((-90 + j * 120 - e * 8) * Math.PI) / 180;
        n.setAttribute('transform', `translate(${(360 + 168 * Math.cos(a)).toFixed(1)} ${(360 + 168 * Math.sin(a)).toFixed(1)})`);
      });
    });
  },
  reset() {
    this.bds.forEach((b, i) => { b._hot = false; b.classList.remove('hot'); this.lbs[i].classList.remove('hot'); });
  },
};
</script>
