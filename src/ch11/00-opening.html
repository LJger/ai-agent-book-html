<script>
HOOKS['c11-cover'] = {
  // 各章光点飞回的位置：取自引言图0-1 的对应关系（-1 表示中心的 Agent）
  MAP: [-1, 1, 1, 2, 2, -1, 0, 0, -1, -1],
  NODES: [['LLM', '#a78bfa', -90], ['上下文', '#22d3ee', 150], ['工具', '#fbbf24', 30]],
  init(s) {
    const c = 360, f = (n) => n.toFixed(1), P = (a, r) => [c + r * Math.cos((a * Math.PI) / 180), c + r * Math.sin((a * Math.PI) / 180)];
    let h = `<svg class="c1cv-svg" viewBox="0 0 720 720" width="720" height="720"><circle class="c1cv-r0" cx="${c}" cy="${c}" r="338"/><circle class="c1cv-r1" cx="${c}" cy="${c}" r="290"/>`;
    this.NODES.forEach(([, , a]) => { const [x, y] = P(a, 150); h += `<line class="c1cv-ln" x1="${c}" y1="${c}" x2="${f(x)}" y2="${f(y)}"/>`; });
    for (let i = 0; i < 10; i++) h += `<g class="c1cv-bd" style="--c:${i < 6 ? '#22d3ee' : '#a78bfa'}"><circle r="22"/><text>${String(i + 1).padStart(2, '0')}</text></g>`;
    h += `<g class="c1cv-core"><circle cx="${c}" cy="${c}" r="72"/><text x="${c}" y="${c}">Agent</text></g>`;
    this.NODES.forEach(([t, col, a]) => { const [x, y] = P(a, 150); h += `<g class="c1cv-nd" style="--c:${col}" transform="translate(${f(x)} ${f(y)})"><circle class="h" r="44"/><circle class="k" r="44"/><text>${t}</text></g>`; });
    for (let i = 0; i < 5; i++) h += `<circle class="c1cv-sp" r="7"/>`;
    h += `<text class="c1cv-lg" x="${c}" y="752">外圈：全书十章　内圈：公式的三个组件</text>`;
    s.querySelector('.c1cv-art').innerHTML = h + '</svg>';
    this.bds = [...s.querySelectorAll('.c1cv-bd')];
    this.nds = [...s.querySelectorAll('.c1cv-nd')];
    this.core = s.querySelector('.c1cv-core');
    this.sps = [...s.querySelectorAll('.c1cv-sp')].map((el) => ({ el, on: false }));
    this.P = P;
  },
  enter(s, ctx) {
    let t0 = null, next = 0, ci = 0;
    ctx.raf((t) => {
      if (t0 === null) t0 = t;
      const e = (t - t0) / 1000, rot = e * 5;
      const pos = this.bds.map((b, i) => { const [x, y] = this.P(-90 + i * 36 + rot, 290); b.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`); return [x, y]; });
      // 每隔一会儿，从下一章发出一个光点，飞回它对应的组件
      if (t > next) {
        next = t + 650;
        const sp = this.sps.find((p) => !p.on);
        if (sp) {
          const i = ci++ % 10, m = this.MAP[i], to = m < 0 ? [360, 360] : this.P(this.NODES[m][2], 150), col = m < 0 ? '#c7d2fe' : this.NODES[m][1];
          Object.assign(sp, { on: true, t0: t, from: pos[i], to, m, col });
          sp.el.style.fill = col; sp.el.style.color = col;
        }
      }
      this.sps.forEach((p) => {
        if (!p.on) return;
        const u = Math.min(1, (t - p.t0) / 1100), k = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        p.el.setAttribute('cx', (p.from[0] + (p.to[0] - p.from[0]) * k).toFixed(1));
        p.el.setAttribute('cy', (p.from[1] + (p.to[1] - p.from[1]) * k).toFixed(1));
        p.el.style.opacity = u < 0.1 ? u * 10 : u > 0.9 ? (1 - u) * 10 : 1;
        if (u >= 1) {
          p.on = false;
          p.el.style.opacity = 0;
          const tgt = p.m < 0 ? this.core : this.nds[p.m];
          U.restart(tgt, 'hit');
        }
      });
    });
  },
  reset() { this.sps.forEach((p) => { p.on = false; p.el.style.opacity = 0; }); },
};
</script>

<script>

  ],
  init(s) {
    s.querySelector('.mp1-cards').innerHTML = this.S.map((t, i) => `<div class="mp1-c" data-i="${i}" style="left:${t.x}px;--c:${t.c}"><em>${t.k}</em><b>${t.b}</b><p>${t.d}</p></div>`).join('');
    s.querySelectorAll('.mp1-c').forEach((c) => {
      c.addEventListener('click', () => C11.jump(this.S[+c.dataset.i].p));
      c.addEventListener('mouseenter', () => { this.auto = false; this.show(s, +c.dataset.i); });
    });

  show(s, i) {
    this.i = i;
    s.querySelectorAll('.mp1-c').forEach((c, j) => c.classList.toggle('on', j === i));

  },
  enter(s, ctx) {
    this.auto = true;
    this.i = -1;
    ctx.later(() => this.auto && this.show(s, 0), 1200);
    ctx.every(() => { if (this.auto) this.show(s, (this.i + 1) % 4); }, 2800);
  },
  reset(s) { s.querySelectorAll('.mp1-c,.mp1-st').forEach((c) => c.classList.remove('on', 'dim')); },
};
</script>
