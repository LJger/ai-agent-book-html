<section class="slide" id="c10-sum" data-part="10" data-dur="16000" data-title="本章小结" data-notes="<b>多 Agent 协作的价值在于引入单个 Agent 原本无法获得的新信息。</b>代码执行结果、视觉反馈和外部工具验证能够打破单一思维链的盲区。因而，是否真正带来信息增量、是否值得额外的 token 成本，应成为是否采用多 Agent 的第一判断标准。<br>多 Agent 系统设计的核心问题包括：上下文是共享还是隔离，以及采用对等协作、管理者编排还是去中心化拓扑。共享上下文保留细节，却容易造成上下文膨胀和角色惯性；隔离上下文更利于并发、模块化和权限控制，但要求通过工具参数、共享文件或消息总线传递结构化的“移交包”。虚拟文件系统、Agent 生命周期、消息协议和 A2A 等机制，分别承担数据平面、控制平面与跨组织互操作的职责。<b>好的协作不是暴露彼此的思考过程，而是约定清晰的接口、边界、权限和验收标准。</b><br>多 Agent 也会放大错误：共享资源会发生并发与语义冲突，错误会沿通信链级联，同质 Agent 会产生同源失效，循环也可能过早终止或无限扩张。乐观锁与工作副本隔离、独立交叉验证、差异化信息源、预算与取消机制，构成了基本的容错闭环；同时，人不能把理解和责任一并外包给 Agent，必须警惕理解债与认知投降。<br>当 Agent 从短期任务协作扩展为长期、开放的群体交互，系统便可能涌现社会关系、文化规范、市场竞争和信息不对称下的策略博弈。更强的模型或单体层面的对齐不会自动带来群体协调；多 Agent 工程的本质，是同时设计<b>信息如何流动、能力如何分工、激励如何约束、争议如何裁决，以及错误如何被发现</b>。只有这些机制足够稳健，群体智能才可能真正高于个体。<br>四张卡片会依次高亮，也可以点击；卡片底部的按钮可以跳回对应部分复习。">

<script>
(() => {
  const Q = [
    ['★★', '共享上下文的多 Agent 协作中，后续 Agent 继承了前序 Agent 的完整上下文。但前一个 Agent 积累的“思维惯性”可能影响后续 Agent 的判断——比如继承了“需求分析师”上下文的“代码审查员”，可能还是倾向于从需求角度思考而非代码质量角度。如何检测和消除这种角色间的干扰？',
      '检测：用 LLM 分析 Agent 轨迹，判断新角色是否仍有“代入”旧角色的行为。消除：切换阶段时同时更换系统提示词与工具集（移除提问工具、换上 linter / 测试工具），强化新身份；在上下文末尾添加系统状态栏，突出当前角色信息。如果实在无法消除角色干扰，应考虑改用不共享上下文的协作方式。', ['c10-inherit', '继承式协作']],
    ['★★', '管理者模式中，Manager Agent 负责任务分解和结果整合。但 Manager 本身的能力上限决定了整个系统的能力上限——如果 Manager 无法正确分解任务，子 Agent 再强也无用。如何确保 Manager 的分解质量？',
      '依据 Plan-and-Act 的结论“弱规划者是系统瓶颈”，应把最强模型分配给 Manager。Harness 手段：分解结果先经审核 LLM 交叉验证，再交付执行；要求 Manager 在分解任务时，为子任务定义明确的验收标准与依赖关系。', ['c10-planner', '弱规划者是瓶颈']],
    ['★★', '去中心化模式借鉴了人类组织的最佳实践。但人类组织也有大量失败模式——沟通不畅、责任推诿、目标冲突。你认为 Agent 社会中最可能出现哪些“组织病”？如何预防？',
      '对照 MAST 的三大类问题：接口不清、职责重叠；对目标的理解不一致、信息被下游误解；谎称“已完成”。此外，还有错误级联放大（传话游戏）、角色间循环移交、Agent 群聊不断发散而无法收敛等问题。预防措施包括：使用契约式接口与统一的消息信封、采用任务状态机并进行验收验证、从独立视角进行交叉验证、检测角色间的相互推诿等。', ['c10-mast', '14 种失败模式']],
    ['★★★', '在管理者模式中，当多个子 Agent 并行执行时，一个子 Agent 的发现可能使其他子 Agent 的工作变得毫无意义（比如搜索任务中一个 Agent 已经找到了答案）。设计一种高效的级联终止机制，实现“一个成功，全员停止”。',
      '子 Agent 发 target_found 给管理者，随后广播 terminate；每个子 Agent 在 ReAct 循环安全点定期检查终止信号，优雅清理（关浏览器会话、释放锁、写完文件）后结束。', ['c10-exp4', '实验 10-4']],
    ['★★★', '本章介绍的乐观锁机制解决了单文件的并发写入冲突，但实际的多 Agent 系统中，共享文件系统还面临跨文件的语义冲突、命名空间污染（Agent 随意创建文件导致目录混乱）和单点故障（一个 Agent 错误地删除了所有文件）等问题。你会如何设计更完善的文件系统治理机制？',
      '分区治理：按照表10-3 划分四类区域，用私有 scratchpad 隔离试错过程。语义冲突：由编排层约定目录级锁文件，检查并获取目录锁之后再进行修改。命名空间污染：制定目录规范和命名约定。单点故障：采用版本控制系统，确保可以利用版本历史回滚，并尽量缩小权限范围。', ['c10-zones', '表10-3 四类区域']],
    ['★★★', '基于市场机制的 Agent 协作（Pinchwork、RentAHuman）引入了交易关系：一个 Agent 花钱雇佣另一个 Agent（或人类）完成任务。那么，雇主 Agent 如何自动衡量执行者交付的结果质量？如果执行者声称已完成但雇主认为质量不达标，争议由谁仲裁？如何防止劣币驱逐良币？',
      '验收不能只是读取 Agent 轨迹，而要采用确定性的外部验证，如执行测试、渲染截图、调用工具核验；利用生成与验证之间的难度差异降低验收成本。争议由独立的第三方审核 Agent 仲裁，并配合资金托管。为防止劣币驱逐良币，应建立基于历史交付记录的声誉体系，让价格信号与质量挂钩。', ['c10-market', 'Agent 经济']],
    ['★★', 'RentAHuman 让 Agent 通过加密货币雇佣人类，反转了传统的人机关系。如果这种模式普及，人类在 Agent 经济中扮演什么角色？仅仅是执行 Agent 无法完成的物理任务吗？',
      '不只是执行 Agent 无法完成的物理任务。人类还可以提供 Agent 单独推理时无法获得的新信息，包括现场感知与真实世界反馈；充当最终验收者与争议仲裁者；作为法律与责任主体承担授权和问责；设定目标、作出价值判断，并在信息不对称和道德边界处发挥制衡作用。', ['c10-market', 'RentAHuman']],
    ['★★', '人类社会需要多人分工协作，是因为每个人的能力有限——做前端的不一定懂后端，懂设计的不一定会运维。但大模型更像一个“全才”。相关研究表明，在纯文本推理任务上，多 Agent 辩论在等量计算资源下并不优于单 Agent。那么，使用多个 Agent 而非单个 Agent 的真正优势到底在哪里？',
      '① 引入外部反馈：执行结果、视觉截图等可以带来生成时不存在的新信息。② 使用目标与角色设定各异的多个 Agent，让它们像人类社会成员一样互相讨论、博弈，可以避免单一 Agent 陷入思维误区。③ 多 Agent 的上下文隔离可以突破上下文窗口限制，实现超长工具调用链。', ['c10-newinfo', '表10-1 新信息判据']],
    ['★★★', '本章将“共享上下文”与“不共享上下文”作为多 Agent 系统的核心设计维度。共享上下文让所有 Agent 看到相同信息，似乎更利于协调。但《三体》中的三体人思维完全透明，技术发展却陷入停滞；回形针思想实验也表明，当群体趋向同一目标时，多样性随之丧失。在多 Agent 系统中，如何在效率与多样性之间找到平衡？',
      '完全共享会放大思维惯性与错误级联，隔离才有认知多样性。手段：用不同提示词 / 模型制造思维偏好（头脑风暴、辩论）；交叉验证者不看前序思考过程，只看原始证据。', ['c10-peer', '多个实例 ≠ 多种思路']],
    ['★★★', '给一个 Coding Agent 分配 30 步预算和 300 步预算，它的工作策略应该如何不同？研究表明，单纯增加步骤预算并不能保证性能提升——Agent 会在浅层搜索后过早“饱和”。设计一种“预算感知”机制，让 Agent 在小预算下快速实现核心功能，在大预算下增加规划、测试和审查环节，充分利用额外的计算资源。',
      '机制：每一步都向提示词注入总预算与剩余预算，按照剩余预算的比例动态调整探索与利用的权重。例如，小预算（30 步）下，跳过规划和审查，直接实现核心功能并进行基本验证；大预算（300 步）下，先规划、再实现、再测试、再审查改进，并按里程碑设置检查点以评估进展，防止浅层饱和。', ['c10-budget', '步骤预算']],
    ['★★', '本章对比了多 Agent 系统与操作系统。虚拟内存与分页、文件权限、死锁检测、调度算法，各对应 Agent 世界的什么？又有哪些操作系统概念在 Agent 世界找不到对应物，为什么？',
      '可能的延伸：虚拟内存 / 换页 ↔ 上下文压缩与检索（热信息留在窗口内，冷信息换出到文件与记忆库，用时再取）；文件权限 ↔ 工具白名单、只读挂载、凭证边界；死锁检测 ↔ 循环移交与互相等待的检测（移交次数上限、超时）；调度算法 ↔ 异步事件处理（第四章）。找不到对应物的地方源于强制力不同：进程的指令由硬件强制执行，Agent 对提示词只是大概率遵循。', ['c10-os', '表10-2 操作系统对照']],
  ];
  const item = ([st, q, a, [go, gn]], n) => `<div class="qa-it"><button class="qa-q"><em>${n}</em><span class="qa-st">${st}</span><span>${q}</span></button><div class="qa-a"><div><span class="tq-lb">参考答案提纲 · 原书附录</span>${a}<br><button class="tq-go" data-go="${go}">回看 · ${gn}</button></div></div></div>`;
  const make = (id, from, to) => {
    HOOKS[id] = {
      init(s) {
        const host = s.querySelector('.tq-list');
        host.innerHTML = Q.slice(from, to).map((x, i) => item(x, from + i + 1)).join('');
        this.open = U.qa(host, { single: true });
        this.n = to - from;
        host.addEventListener('click', (e) => {
          const g = e.target.closest('[data-go]');
          if (g) { e.stopPropagation(); const idx = [...document.querySelectorAll('#deck .slide')].findIndex((x) => x.id === g.dataset.go); if (idx >= 0) DECK.go(idx, 0); return; }
          if (e.target.closest('.qa-q')) this.auto = false;
        });
      },
      enter(s, ctx) {
        this.auto = true;
        this.k = 0;
        ctx.later(() => this.auto && this.open(0), 1200);
        ctx.every(() => { if (!this.auto) return; this.k = (this.k + 1) % this.n; this.open(this.k); }, 5200);
      },
      reset(s) { s.querySelectorAll('.qa-it').forEach((x) => x.classList.remove('open')); },
    };
  };
  make('c10-qa', 0, 6);
  make('c10-qa2', 6, 11);
})();
</script>

<script>
HOOKS['c10-end'] = {

  init(s) {
    const S = 620, c = 310, R = 220, f = (n) => n.toFixed(1);

    P.forEach(([x, y], i) => {
      const [x2, y2] = P[(i + 2) % 5];
      h += `<path class="en-link" d="M${f(x)} ${f(y)}L${f(x2)} ${f(y2)}" id="enl${i}"/>`;
      h += `<circle r="5" fill="#fff" style="filter:drop-shadow(0 0 6px #fff)"><animateMotion dur="${(3 + i * 0.4).toFixed(1)}s" begin="${-i}s" repeatCount="indefinite"><mpath href="#enl${i}"/></animateMotion></circle>`;
    });
    h += `<circle class="en-core" cx="${c}" cy="${c}" r="96"/><circle class="en-wave" cx="${c}" cy="${c}" r="96"/><text class="en-ct" x="${c}" y="${c - 12}">群体智能</text><text class="en-cs" x="${c}" y="${c + 28}">高于个体</text>`;
    P.forEach(([x, y], i) => { h += `<g class="en-node" data-k="${i}" style="--c:${this.M[i][1]}" transform="translate(${f(x)} ${f(y)})"><circle r="58"/><text>${this.M[i][0]}</text></g>`; });
    s.querySelector('.en-fig').innerHTML = h + '</svg>';
  },
  enter(s, ctx) {
    let k = 0;
    const tick = () => {
      s.querySelectorAll('.en-node').forEach((n) => n.classList.toggle('on', +n.dataset.k === k));
      s.querySelectorAll('.en-list li').forEach((li, j) => li.classList.toggle('on', j === k));

};
</script>
