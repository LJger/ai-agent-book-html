<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深入理解 AI Agent · 动画版 · 总目录</title>
<style>
/* 深入理解 AI Agent · 动画版 —— 演示引擎样式（各章共用） */
@property --acc{syntax:'<color>';inherits:true;initial-value:#22d3ee}
@property --acc2{syntax:'<color>';inherits:true;initial-value:#a78bfa}
:root{
  --bg:#050816;--text:#e9edf8;--text2:#a5afc9;--text3:#6c7695;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.17);
  /* 语义色：与核心公式一一对应，全书统一 */
  --llm:#a78bfa;--ctx:#22d3ee;--tool:#fbbf24;--env:#34d399;--har:#60a5fa;
  --ok:#34d399;--bad:#fb7185;--warn:#fb923c;--pink:#f472b6;--teal:#2dd4bf;--blue:#60a5fa;--violet:#a78bfa;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--eio:cubic-bezier(.7,0,.3,1);
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --num:"Segoe UI","Inter","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace;
  --kai:KaiTi,STKaiti,"Kaiti SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
body{--acc:#22d3ee;--acc2:#a78bfa;transition:--acc 1.2s var(--ease),--acc2 1.2s var(--ease);-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul,ol{list-style:none}
a{color:inherit;text-decoration:none}

/* ---------- 背景层 ---------- */
#bg,#fx{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#bg{z-index:0}#fx{z-index:45;pointer-events:none}
.aurora{position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(100px);opacity:.4}
.aurora i{position:absolute;border-radius:50%;display:block}
.aurora .a1{width:55vmax;height:55vmax;left:8%;top:12%;background:radial-gradient(circle,var(--acc),transparent 62%);animation:au1 36s ease-in-out infinite alternate}
.aurora .a2{width:50vmax;height:50vmax;right:6%;bottom:6%;background:radial-gradient(circle,var(--acc2),transparent 62%);animation:au2 42s ease-in-out infinite alternate}
.aurora .a3{width:40vmax;height:40vmax;left:40%;top:45%;background:radial-gradient(circle,#1e3a8a,transparent 65%);animation:au3 50s ease-in-out infinite alternate}
@keyframes au1{to{transform:translate(18vw,10vh) scale(1.15)}}
@keyframes au2{to{transform:translate(-16vw,-12vh) scale(.9)}}
@keyframes au3{to{transform:translate(-20vw,8vh) scale(1.2)}}
.gridlines{position:fixed;inset:0;z-index:1;pointer-events:none;background-image:linear-gradient(rgba(148,163,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,255,.05) 1px,transparent 1px);background-size:72px 72px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 30%,transparent 80%)}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(1,3,10,.8) 100%)}
#viewport{position:fixed;inset:0;z-index:2}
#deck{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%}

/* ---------- 过渡特效：章节切换时的光束扫过 ---------- */
#sweep{position:fixed;top:-20vh;bottom:-20vh;left:0;width:34vw;z-index:44;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--acc) 22%,transparent) 35%,rgba(255,255,255,.28) 50%,color-mix(in srgb,var(--acc2) 22%,transparent) 65%,transparent);
  filter:blur(8px);mix-blend-mode:screen}

/* ---------- 幻灯片与入场动画 ---------- */
.slide{position:absolute;inset:0;padding:92px 130px 110px;display:flex;flex-direction:column;visibility:hidden;opacity:0;pointer-events:none}
.slide.active{visibility:visible;opacity:1;pointer-events:auto;z-index:2}
.slide.leaving{pointer-events:none;z-index:1}
.slide:not(.active) *{animation-play-state:paused!important}
.no-trans,.no-trans *{transition:none!important;animation:none!important}
/* 入场动画：.fx + 方向类（fx-up/left/right/scale/pop/blur/flip/zoom），--d 控制先后顺序。
   注意：.fx 占用了元素的 transition 和 transform。需要自己写过渡或位移的元素，
   要么在外面再包一层负责入场，要么改用 translate / scale 这两个独立属性。 */
.fx{opacity:0;transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease);transition-delay:calc(var(--d,0)*90ms + 120ms)}
.fx-up{transform:translateY(40px)}.fx-down{transform:translateY(-40px)}
.fx-left{transform:translateX(-56px)}.fx-right{transform:translateX(56px)}
.fx-scale{transform:scale(.86)}
.fx-pop{transform:scale(.5);transition-timing-function:var(--ease),var(--spring),var(--ease)}
.fx-blur{filter:blur(16px);transform:scale(1.06)}
.fx-flip{transform:perspective(1200px) rotateX(-70deg);transform-origin:50% 0}
.fx-zoom{transform:scale(1.5);filter:blur(10px)}
.active .fx:not([data-step]):not([data-step] .fx),.active [data-step].on.fx,.active [data-step].on .fx{opacity:1;transform:none;filter:none}

/* ---------- 文字 ---------- */
.sh{position:relative;z-index:3;margin-bottom:30px}
.kicker{display:flex;align-items:center;gap:14px;font:600 20px/1 var(--font);letter-spacing:.3em;color:var(--acc)}
.kicker::before{content:"";width:40px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--acc),transparent)}
.title{font-size:56px;font-weight:700;line-height:1.25;margin-top:18px;letter-spacing:.01em}
.title em,.grad{font-style:normal;background:linear-gradient(92deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:27px;line-height:1.65;color:var(--text2);margin-top:14px}
.muted{color:var(--text2)}.dim{color:var(--text3)}
.c-llm{color:var(--llm)}.c-ctx{color:var(--ctx)}.c-tool{color:var(--tool)}.c-env{color:var(--env)}.c-har{color:var(--har)}
.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}.c-acc{color:var(--acc)}
.mono{font-family:var(--mono)}.num{font-family:var(--num)}
.sel{user-select:text}
.src{position:absolute;left:130px;bottom:58px;z-index:3;font-size:16px;color:var(--text3);letter-spacing:.04em}
.src::before{content:"原书 · ";color:var(--acc)}

/* ---------- 通用容器 ---------- */
.glass{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02) 60%);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel{position:relative;background:rgba(12,18,40,.72);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;font-size:19px;line-height:1.3;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--text2);white-space:nowrap}
.chip.llm,.chip.ctx,.chip.tool,.chip.env,.chip.har,.chip.ok,.chip.bad,.chip.warn,.chip.acc{color:var(--cc);border-color:color-mix(in srgb,var(--cc) 42%,transparent);background:color-mix(in srgb,var(--cc) 11%,transparent)}
.chip.llm{--cc:var(--llm)}.chip.ctx{--cc:var(--ctx)}.chip.tool{--cc:var(--tool)}.chip.env{--cc:var(--env)}.chip.har{--cc:var(--har)}
.chip.ok{--cc:var(--ok)}.chip.bad{--cc:var(--bad)}.chip.warn{--cc:var(--warn)}.chip.acc{--cc:var(--acc)}
.ic{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:32px;padding:0 9px;border-radius:8px;border:1px solid var(--line2);border-bottom-width:3px;background:rgba(255,255,255,.06);font:600 16px/1 var(--num);color:var(--text)}
.foot{position:absolute;left:130px;right:130px;bottom:62px;font-size:19px;color:var(--text3);display:flex;gap:10px;align-items:center}
.quote{font-size:30px;line-height:1.75;color:var(--text);padding:6px 0 6px 30px;border-left:4px solid var(--acc)}
.tagline{font-size:26px;line-height:1.6;color:var(--text);padding:18px 28px;border-radius:16px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 16%,transparent),transparent);border-left:4px solid var(--acc)}
.tagline b{color:var(--acc)}

/* ---------- 窗口 / 代码 ---------- */
.win{background:rgba(5,9,22,.85);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.85)}
.win-bar{height:42px;display:flex;align-items:center;gap:9px;padding:0 18px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--line);font:15px var(--mono);color:var(--text3)}
.win-bar i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.win-bar i:nth-child(2){background:#febc2e}.win-bar i:nth-child(3){background:#28c840}
.win-bar span{margin-left:10px}
.code{font:20px/1.75 var(--mono);color:#cbd5f5;padding:20px 26px;white-space:pre}
.t-k{color:#c084fc}.t-s{color:#86efac}.t-c{color:#5f6b8a}.t-n{color:#fbbf24}.t-p{color:#7dd3fc}.t-h{color:#f0abfc;font-weight:700}.t-r{color:#fb7185}.t-g{color:#34d399}
.typing::after{content:"▍";color:var(--acc);animation:blink 1s steps(1) infinite;margin-left:2px}
.code .ln{display:block;border-radius:6px;transition:background .35s,box-shadow .35s}
.code .ln.hl{background:color-mix(in srgb,var(--acc) 16%,transparent);box-shadow:inset 3px 0 0 var(--acc)}

/* ---------- 动画关键帧 ---------- */
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.2);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes floaty{50%{transform:translateY(-10px)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes pop{to{transform:scale(1)}}
@keyframes swIn{from{opacity:0;transform:translateX(24px)}}
@keyframes upIn{from{opacity:0;transform:translateY(18px)}}
@keyframes arcDraw{to{stroke-dashoffset:0}}
@keyframes nodeIn{to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes glowPulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c,var(--acc)) 18%,transparent),0 0 40px color-mix(in srgb,var(--c,var(--acc)) 45%,transparent)}}

/* ---------- 控件 ---------- */
.seg{position:relative;display:inline-flex;padding:5px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.seg button{position:relative;z-index:1;padding:10px 26px;border-radius:999px;font-size:20px;color:var(--text2);transition:color .3s}
.seg button.on{color:#06101f;font-weight:600}
.seg .knob{position:absolute;top:5px;bottom:5px;left:5px;width:0;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 18px color-mix(in srgb,var(--acc) 50%,transparent);transition:all .55s var(--spring)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{padding:10px 20px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:20px;color:var(--text2);transition:all .3s}
.tabs button:hover{color:var(--text);border-color:var(--line2)}
.tabs button.on{color:#06101f;background:linear-gradient(90deg,var(--acc),var(--acc2));border-color:transparent;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font-size:18px;color:var(--text2);transition:all .25s}
.btn:hover{color:var(--text);background:rgba(255,255,255,.1)}
.btn.pri{color:#06101f;font-weight:600;border-color:transparent;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 18px color-mix(in srgb,var(--acc) 40%,transparent)}
.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;pointer-events:none}
a.btn.soon{opacity:.55;filter:saturate(.4)}
/* 开关：<button class="tgl" data-on><i></i>文字</button> */
.tgl{display:inline-flex;align-items:center;gap:12px;padding:8px 16px 8px 10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:19px;color:var(--text2);transition:all .3s}
.tgl i{position:relative;width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,.12);transition:background .3s;flex:none}
.tgl i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#cbd5e1;transition:transform .35s var(--spring),background .3s}
.tgl.on{color:var(--text);border-color:color-mix(in srgb,var(--tc,var(--acc)) 45%,transparent);background:color-mix(in srgb,var(--tc,var(--acc)) 9%,transparent)}
.tgl.on i{background:color-mix(in srgb,var(--tc,var(--acc)) 70%,transparent)}
.tgl.on i::after{transform:translateX(20px);background:#fff}
/* 滑块 */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--acc) var(--p,0%),rgba(255,255,255,.12) var(--p,0%));outline:none;cursor:pointer}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--acc);box-shadow:0 0 14px var(--acc)}
.rng::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--acc);box-shadow:0 0 14px var(--acc)}
/* 勾选项 */
.chk{display:flex;gap:18px;align-items:flex-start;padding:16px 20px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;transition:background .35s,border-color .35s}
.chk:hover{border-color:var(--line2)}
.chk .box{flex:none;width:32px;height:32px;border-radius:10px;border:2px solid var(--line2);display:grid;place-items:center;transition:all .4s var(--spring)}
.chk .box svg{width:20px;height:20px;stroke:#04121a;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .4s ease .1s}
.chk.done{border-color:color-mix(in srgb,var(--acc) 50%,transparent);background:color-mix(in srgb,var(--acc) 9%,transparent)}
.chk.done .box{background:var(--acc);border-color:var(--acc);transform:scale(1.08);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 60%,transparent)}
.chk.done .box svg{stroke-dashoffset:0}
/* 翻转卡片 */
.flip{perspective:1400px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .9s var(--ease);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:24px 28px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.flip-f{background:rgba(12,18,40,.82)}
.flip-b{transform:rotateY(180deg);background:rgba(6,26,36,.88);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
/* 进度细条（轮播计时） */
.runbar{height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.runbar i{display:block;height:100%;width:100%;background:var(--c,var(--acc));transform-origin:left;transform:scaleX(0)}
.runbar.run i{animation:grow var(--dur,4.2s) linear forwards}
.sw{animation:swIn .55s var(--ease) both}

/* ---------- 概念演示通用件 ---------- */
/* 图节点：<div class="nd" style="--c:var(--llm)"><svg class="ic">…</svg><div><b>标题</b><small>说明</small></div></div> */
.nd{position:relative;display:flex;align-items:center;gap:16px;padding:16px 22px;border-radius:18px;background:rgba(12,18,40,.88);border:1px solid var(--line2);transition:all .5s var(--ease)}
.nd>.ic{flex:none;font-size:34px;color:var(--c,var(--text3));transition:color .5s}
.nd b{display:block;font-size:23px}.nd small{display:block;font-size:16px;color:var(--text3);margin-top:3px}
.nd.on{border-color:var(--c,var(--acc));background:color-mix(in srgb,var(--c,var(--acc)) 13%,rgba(12,18,40,.92));box-shadow:0 0 34px color-mix(in srgb,var(--c,var(--acc)) 35%,transparent);transform:translateY(-3px)}
.nd.dim{opacity:.38}
/* 流动连线（SVG path） */
.fl{fill:none;stroke:rgba(255,255,255,.16);stroke-width:2.5;stroke-dasharray:6 8;transition:stroke .5s,opacity .5s}
.fl.on{stroke:var(--c,var(--acc));stroke-width:3;animation:flow 1s linear infinite;filter:drop-shadow(0 0 6px var(--c,var(--acc)))}
.fl.bad{stroke:var(--bad)}
.pk{fill:#fff;filter:drop-shadow(0 0 8px var(--c,#fff))}
/* 消息列表（上下文窗口）：<div class="ml"><div class="mr" data-r="system">…</div></div> */
.ml{display:flex;flex-direction:column;gap:8px}
.mr{--c:var(--text3);position:relative;display:flex;align-items:flex-start;gap:12px;padding:10px 16px 10px 18px;border-radius:12px;background:color-mix(in srgb,var(--c) 9%,rgba(10,16,36,.9));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);font-size:18px;line-height:1.5;transition:all .5s var(--ease)}
.mr::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--c)}
.mr .rl{flex:none;min-width:86px;font:600 15px/1.9 var(--mono);color:var(--c)}
.mr .tx{flex:1;min-width:0;color:var(--text)}
.mr[data-r=system]{--c:#94a3b8}.mr[data-r=tools]{--c:var(--har)}.mr[data-r=user]{--c:var(--tool)}
.mr[data-r=assistant]{--c:var(--llm)}.mr[data-r=tool]{--c:var(--env)}.mr[data-r=status]{--c:var(--pink)}
.mr.new{animation:upIn .6s var(--spring) both}
.mr.ghost{opacity:.25;filter:grayscale(1)}
.mr.bad{border-color:var(--bad);box-shadow:0 0 18px color-mix(in srgb,var(--bad) 35%,transparent)}
/* 计量条 */
.meter{height:14px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.meter i{display:block;height:100%;width:var(--v,0%);border-radius:999px;background:linear-gradient(90deg,var(--c,var(--acc)),color-mix(in srgb,var(--c,var(--acc)) 60%,#fff));transition:width .9s var(--ease)}
/* 圆形徽标 */
.orb{position:relative;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:52px;color:var(--c,var(--acc));background:radial-gradient(circle at 30% 25%,#1a2347,#0a1024 70%);border:1px solid var(--line2);transition:all .5s var(--ease)}
.orb.on{border-color:var(--c);box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 14%,transparent),0 0 60px color-mix(in srgb,var(--c) 50%,transparent);transform:scale(1.06)}
/* 编号列表（当前 / 已完成） */
.sl{display:flex;flex-direction:column;gap:12px}
.sl li{display:flex;gap:18px;align-items:flex-start;padding:14px 18px;border-radius:16px;border:1px solid transparent;opacity:.5;transition:all .5s var(--ease)}
.sl li>span{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 19px var(--num);border:2px solid var(--line2);color:var(--text2);transition:all .5s}
.sl b{font-size:24px}.sl p{font-size:18px;color:var(--text2);margin-top:4px;line-height:1.5}
.sl li.done{opacity:.82}
.sl li.done>span{background:color-mix(in srgb,var(--acc) 25%,transparent);border-color:var(--acc);color:var(--acc)}
.sl li.cur{opacity:1;background:color-mix(in srgb,var(--acc) 10%,transparent);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.sl li.cur>span{background:var(--acc);border-color:var(--acc);color:#06101f;box-shadow:0 0 18px var(--acc)}

/* 徽标、说明文字、印章 */
.badge{--c:var(--acc);display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:10px;font-size:18px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);white-space:nowrap}
.cap{font-size:17px;color:var(--text3);line-height:1.6}
.lbl{font-size:15px;letter-spacing:.14em;color:var(--text3)}

<script>
/* 演示引擎 · 核心（页面头部加载）：HOOKS 注册表、通用工具 U、背景粒子
 *
 * 每页的钩子：HOOKS['页面id'] = { init(s), enter(s, ctx, k, dir), step(s, ctx, k, dir), leave(s), reset(s) }
 *   init  —— 页面加载时调用一次，用来生成 DOM
 *   enter —— 进入页面时调用；k 是当前步，dir 是翻页方向（1 前进 / -1 后退）
 *   step  —— 在页内按 → / ← 切换步骤时调用
 *   leave / reset —— 离开页面时调用；reset 在离场动画结束后把页面恢复到初始状态
 * ctx 提供 later / every / raf，离开页面时自动清理，不会泄漏计时器。
 */
window.HOOKS = {};
window.U = {
  scale: 1,
  _id: 0,
  reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
  ease: (t) => 1 - Math.pow(1 - t, 3),

    let s = seed >>> 0 || 1;

      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;

  ic: (n, c = '') => `<svg class="ic ${c}"><use href="#i-${n}"/></svg>`,

  local(el, e) {
    const r = el.getBoundingClientRect();
    return { x: (e.clientX - r.left) / U.scale, y: (e.clientY - r.top) / U.scale };
  },

    return new Promise((res) => {
      const tick = (now) => {
        if ((o.ctx && !o.ctx.alive) || (o.alive && !o.alive())) { dot.style.opacity = 0; res(false); return; }
        const t = Math.min(1, Math.max(0, (now - t0) / ms)), e = ease(t);
        const p = path.getPointAtLength((o.reverse ? 1 - e : e) * len);
        dot.setAttribute('cx', p.x.toFixed(1));
        dot.setAttribute('cy', p.y.toFixed(1));
        dot.style.opacity = t <= 0 ? 0 : t < 0.08 ? t / 0.08 : t > 0.92 && !o.keep ? (1 - t) / 0.08 : 1;
        if (t < 1) requestAnimationFrame(tick);
        else { dot.style.opacity = o.keep ? 1 : 0; res(true); }
      };
      requestAnimationFrame(tick);
    });
  },
  // 重新触发某个 CSS 动画类
  restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); },
  // 把标题拆成单字，配合 .split .ch 做逐字入场；data-grad="#色1,#色2" 给出渐变色，data-off 是起始延迟序号
  splitChars(el) {
    const t = el.textContent.trim(), off = +el.dataset.off || 0, gr = el.dataset.grad;
    const A = gr ? gr.split(',').map((h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }) : null;
    el.innerHTML = [...t].map((c, j) => {
      let col = '';
      if (A) {
        const u = t.length > 1 ? j / (t.length - 1) : 0, seg = u * (A.length - 1), a = Math.min(A.length - 2, Math.floor(seg)), fr = seg - a;
        col = ';color:rgb(' + A[a].map((v, q) => Math.round(v + (A[a + 1][q] - v) * fr)) + ')';
      }
      return `<span class="ch" style="--i:${j + off}${col}">${c === ' ' ? '&nbsp;' : c}</span>`;
    }).join('');
  },
  // 数字格式：dec 小数位，sep 千分位，prefix/suffix 前后缀
  fmt(v, o = {}) {
    const dec = +o.dec || 0;
    const s = o.sep ? v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) : v.toFixed(dec);
    return (o.prefix || '') + s + (o.suffix || '');
  },
  count(el, to, o = {}) {
    const dur = o.dur || 1600, ctx = o.ctx, from = +o.from || 0;
    el.textContent = U.fmt(from, o);
    U.later(ctx, () => {
      const t0 = performance.now();
      const tick = () => {
        if (ctx && !ctx.alive) return;
        const t = Math.min(1, (performance.now() - t0) / dur);
        el.textContent = U.fmt(from + (to - from) * U.ease(t), o);
        if (t < 1) requestAnimationFrame(tick);
      };
      tick();
    }, o.delay || 0);
  },
  type(el, o = {}) {
    const txt = el.dataset.orig ?? el.textContent;
    el.dataset.orig = txt;
    el.textContent = '';
    el.classList.add('typing');
    const sp = o.speed || 40, ctx = o.ctx;
    let i = 0;
    const tick = () => {
      if (ctx && !ctx.alive) return;
      i++;
      el.textContent = txt.slice(0, i);
      if (i < txt.length) U.later(ctx, tick, sp);
      else U.later(ctx, () => { el.classList.remove('typing'); o.done && o.done(); }, 700);
    };
    U.later(ctx, tick, o.delay || 0);
  },
  scramble(el, o = {}) {
    const txt = el.dataset.orig ?? el.textContent;
    el.dataset.orig = txt;
    const cs = '▓▒░<>/{}[]=+*#%&ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
    const dur = o.dur || 1200, ctx = o.ctx;
    const rnd = () => [...txt].map((c) => (c === ' ' || c === '\n' ? c : cs[(Math.random() * cs.length) | 0])).join('');
    el.textContent = rnd();
    U.later(ctx, () => {
      const t0 = performance.now();
      const tick = () => {
        if (ctx && !ctx.alive) return;
        const t = Math.min(1, (performance.now() - t0) / dur), n = Math.floor(txt.length * t);
        let s = txt.slice(0, n);
        for (let i = n; i < txt.length; i++) {
          const c = txt[i];
          s += c === ' ' || c === '\n' ? c : cs[(Math.random() * cs.length) | 0];
        }
        el.textContent = s;
        if (t < 1) requestAnimationFrame(tick);
        else el.textContent = txt;
      };
      tick();
    }, o.delay || 0);
  },
  // 思考题折叠列表：点击题干展开 / 收起（single 为 true 时同时只展开一题）；返回 open(i) 供分步或自动演示调用
  qa(host, o = {}) {
    const items = [...host.querySelectorAll('.qa-it')];
    const open = (i) => items.forEach((it, j) => it.classList.toggle('open', o.single === false ? it.classList.contains('open') || j === i : j === i));
    items.forEach((it, i) => it.querySelector('.qa-q').addEventListener('click', () => {
      if (it.classList.contains('open')) it.classList.remove('open');
      else open(i);
    }));
    return open;
  },
  toast(m) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = m;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove('show'), 1800);
  },
  copy(text) {
    const ok = () => U.toast('已复制到剪贴板');
    const fb = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) { U.toast('复制失败，请手动选择文本'); }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb);
    else fb();
  },
  confetti(x, y, n = 150) {
    const cv = document.getElementById('fx'), g = cv.getContext('2d'), d = Math.min(2, devicePixelRatio || 1);
    cv.width = innerWidth * d;
    cv.height = innerHeight * d;
    g.setTransform(d, 0, 0, d, 0, 0);
    const cols = ['#22d3ee', '#a78bfa', '#fbbf24', '#34d399', '#fb7185', '#60a5fa'];
    const ps = Array.from({ length: n }, () => ({
      x, y, vx: (Math.random() - 0.5) * 18, vy: -Math.random() * 17 - 5, r: Math.random() * 7 + 4,
      a: Math.random() * 6.3, va: (Math.random() - 0.5) * 0.4, c: cols[(Math.random() * 6) | 0], l: 1,
    }));
    const tick = () => {
      g.clearRect(0, 0, innerWidth, innerHeight);
      let k = 0;
      for (const p of ps) {
        p.vy += 0.42; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.a += p.va; p.l -= 0.007;
        if (p.l > 0 && p.y < innerHeight + 40) {
          k++;
          g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.globalAlpha = p.l; g.fillStyle = p.c;
          g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore();
        }
      }
      if (k) requestAnimationFrame(tick);
      else g.clearRect(0, 0, innerWidth, innerHeight);
    };
    tick();
  },
  // 分段开关：<div class="seg"><i class="knob"></i><button data-v="a">…</button>…</div>
  seg(host, onPick) {
    const knob = host.querySelector('.knob'), bs = [...host.querySelectorAll('button')];
    const set = (v) => {
      bs.forEach((b) => b.classList.toggle('on', b.dataset.v === v));
      const b = bs.find((x) => x.dataset.v === v);
      if (b && knob) { knob.style.left = b.offsetLeft + 'px'; knob.style.width = b.offsetWidth + 'px'; }
    };
    bs.forEach((b) => b.addEventListener('click', () => { set(b.dataset.v); onPick && onPick(b.dataset.v, true); }));
    return set;
  },

  // 环形图：nodes = [{label, color}]；active 高亮第几个；center(c, S) 返回中心 SVG
  ring(host, o = {}) {
    const id = 'rg' + ++U._id, S = o.size || 640, c = S / 2, R = o.r || S * 0.34, nr = o.nodeR || S * 0.056;
    const st = o.nodes || [], N = st.length;
    const A = (i) => ((-90 + (i * 360) / N) * Math.PI) / 180;
    const P = (i, r = R) => [c + r * Math.cos(A(i)), c + r * Math.sin(A(i))];
    const gap = (nr + 9) / R, f = (n) => n.toFixed(1);
    let h = `<svg class="loop-svg" viewBox="0 0 ${S} ${S}"><defs><filter id="${id}g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="${f(S / 120)}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
    h += `<circle class="ring r1" cx="${c}" cy="${c}" r="${f(R + nr + S * 0.05)}"/><circle class="ring r2" cx="${c}" cy="${c}" r="${f(R - nr - S * 0.045)}"/>`;
    for (let i = 0; i < N; i++) {
      const a1 = A(i) + gap, a2 = A(i + 1) - gap;
      const d = `M${f(c + R * Math.cos(a1))} ${f(c + R * Math.sin(a1))}A${R} ${R} 0 0 1 ${f(c + R * Math.cos(a2))} ${f(c + R * Math.sin(a2))}`;
      h += `<path class="arc" d="${d}" style="--c:${st[i].color};--len:${f(R * (a2 - a1))};--i:${i}"/><path class="arc-flow" d="${d}" style="--c:${st[i].color}"/>`;
    }
    if (o.comet !== false) {
      const cp = `M${c} ${c - R}A${R} ${R} 0 1 1 ${c - 0.01} ${c - R}`;
      [[1, 0], [0.75, -0.08], [0.5, -0.16], [0.3, -0.24]].forEach(([k, b]) => {
        h += `<circle class="comet" r="${f((S / 160) * k + 1.2)}" fill-opacity="${k}" filter="url(#${id}g)"><animateMotion dur="${o.cometDur || 9}s" begin="${b}s" repeatCount="indefinite" path="${cp}"/></circle>`;
      });
    }
    if (o.center) h += o.center(c, S);
    for (let i = 0; i < N; i++) {
      const [x, y] = P(i), on = o.active === i, dm = o.active != null && o.active >= 0 && !on;
      const num = st[i].num ?? String(i + 1).padStart(2, '0');
      h += `<g class="node${on ? ' on' : ''}${dm ? ' dim' : ''}" data-i="${i}" style="--c:${st[i].color};--i:${i}" transform="translate(${f(x)} ${f(y)})"><g class="node-in"><circle class="halo" r="${nr}"/><circle class="core" r="${nr}"/><text class="num" style="font-size:${f(nr * 0.62)}px">${num}</text></g></g>`;
      if (o.labels !== false) {
        const [lx, ly] = P(i, R + nr + (o.labelGap || S * 0.055)), co = Math.cos(A(i));
        const an = co > 0.25 ? 'start' : co < -0.25 ? 'end' : 'middle';
        h += `<text class="lab${on ? ' on' : ''}${dm ? ' dim' : ''}" data-i="${i}" x="${f(lx)}" y="${f(ly)}" text-anchor="${an}" style="--c:${st[i].color};--i:${i};font-size:${f(o.labelSize || S * 0.036)}px">${st[i].label}</text>`;
      }
    }
    host.innerHTML = h + '</svg>';
    return host.querySelector('svg');
  },

  // 轨道图（封面）：中心核心 + 若干条倾斜椭圆轨道上的卫星，卫星标签始终保持水平
  orbit(host, o = {}) {
    const id = 'ob' + ++U._id, S = o.size || 700, c = S / 2, f = (n) => n.toFixed(1);
    let h = `<svg class="orbit-svg" viewBox="0 0 ${S} ${S}"><defs>
      <radialGradient id="${id}c"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="${o.coreColor || '#a5f3fc'}"/><stop offset="1" stop-color="${o.coreColor || '#22d3ee'}" stop-opacity="0"/></radialGradient>
      <filter id="${id}g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="${f(S / 110)}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
    if (o.outer) {
      h += `<circle class="ob-outer" cx="${c}" cy="${c}" r="${f(S * 0.47)}"/>`;
      h += `<path id="${id}t" d="M${f(c - S * 0.47)} ${c}A${f(S * 0.47)} ${f(S * 0.47)} 0 0 1 ${f(c + S * 0.47)} ${c}" fill="none"/>`;
      h += `<text class="ob-outer-t"><textPath href="#${id}t" startOffset="50%" text-anchor="middle">${o.outer}</textPath></text>`;
    }
    (o.sats || []).forEach((s, i) => {
      const rx = s.rx * S, ry = s.ry * S, t = ((s.tilt || 0) * Math.PI) / 180;
      const x1 = c - rx * Math.cos(t), y1 = c - rx * Math.sin(t), x2 = c + rx * Math.cos(t), y2 = c + rx * Math.sin(t);
      const d = `M${f(x1)} ${f(y1)}A${f(rx)} ${f(ry)} ${s.tilt || 0} 1 1 ${f(x2)} ${f(y2)}A${f(rx)} ${f(ry)} ${s.tilt || 0} 1 1 ${f(x1)} ${f(y1)}`;
      h += `<path id="${id}p${i}" class="ob-path" d="${d}" style="--c:${s.color}"/>`;
      h += `<g class="ob-sat" style="--c:${s.color}"><circle class="ob-glow" r="${f(S * 0.05)}" filter="url(#${id}g)"/><circle class="ob-dot" r="${f(S * 0.034)}"/><text class="ob-lab" y="${f(S * 0.075)}">${s.label}</text>`;
      h += `<animateMotion dur="${s.dur || 12}s" begin="${-(s.phase || 0) * (s.dur || 12)}s" repeatCount="indefinite"><mpath href="#${id}p${i}"/></animateMotion></g>`;
    });
    h += `<circle class="ob-halo" cx="${c}" cy="${c}" r="${f(S * 0.16)}" fill="url(#${id}c)"/>`;
    h += `<circle class="ob-core" cx="${c}" cy="${c}" r="${f(S * 0.09)}"/>`;
    h += `<circle class="ob-wave" cx="${c}" cy="${c}" r="${f(S * 0.09)}"/><circle class="ob-wave w2" cx="${c}" cy="${c}" r="${f(S * 0.09)}"/>`;
    h += `<text class="ob-core-t" x="${c}" y="${c}">${o.core || 'Agent'}</text>`;
    host.innerHTML = h + '</svg>';
    return host.querySelector('svg');
  },

  // 背景粒子网络：color(a, b) 渐变到新的强调色，warp(v) 触发一次曲速效果
  background(cv) {
    const g = cv.getContext('2d');
    let W, Hh, pts = [], warp = 0, mx = 0, my = 0, cx = 0, cy = 0;
    const col = [34, 211, 238], col2 = [167, 139, 250];
    let tg = [34, 211, 238], tg2 = [167, 139, 250];
    const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const mk = () => ({ x: Math.random() * W, y: Math.random() * Hh, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, z: Math.random() * 0.8 + 0.2, r: Math.random() * 1.6 + 0.5 });
    function rs() {
      const d = Math.min(2, devicePixelRatio || 1);
      W = innerWidth; Hh = innerHeight;
      cv.width = W * d; cv.height = Hh * d;
      g.setTransform(d, 0, 0, d, 0, 0);
      pts = Array.from({ length: Math.round(Math.min(130, (W * Hh) / 15000)) }, mk);
    }
    function frame() {
      requestAnimationFrame(frame);
      if (document.hidden) return;
      g.clearRect(0, 0, W, Hh);
      for (let i = 0; i < 3; i++) { col[i] += (tg[i] - col[i]) * 0.04; col2[i] += (tg2[i] - col2[i]) * 0.04; }
      warp *= 0.955; cx += (mx - cx) * 0.05; cy += (my - cy) * 0.05;
      const ox = W / 2, oy = Hh / 2, c1 = `rgba(${col.map(Math.round)},`, c2 = `rgba(${col2.map(Math.round)},`;
      for (const p of pts) {
        p.px = p.x; p.py = p.y; p.x += p.vx * p.z; p.y += p.vy * p.z;
        if (warp > 0.02) { const dx = p.x - ox, dy = p.y - oy, d = Math.hypot(dx, dy) || 1, s = warp * 24 * p.z; p.x += (dx / d) * s; p.y += (dy / d) * s; }
        if (p.x < -30 || p.x > W + 30 || p.y < -30 || p.y > Hh + 30) {
          if (warp > 0.1) { p.x = ox + (Math.random() - 0.5) * W * 0.35; p.y = oy + (Math.random() - 0.5) * Hh * 0.35; }
          else { p.x = ((p.x + W + 60) % (W + 60)) - 30; p.y = ((p.y + Hh + 60) % (Hh + 60)) - 30; }
          p.px = p.x; p.py = p.y;
        }
      }
      if (warp < 0.45) {
        const L2 = 140 * 140;
        g.lineWidth = 1;
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i];
          for (let j = i + 1; j < pts.length; j++) {
            const b = pts[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
            if (d2 < L2) {
              g.strokeStyle = c1 + ((1 - d2 / L2) * 0.17 * (1 - warp * 2)).toFixed(3) + ')';
              g.beginPath(); g.moveTo(a.x + cx * a.z, a.y + cy * a.z); g.lineTo(b.x + cx * b.z, b.y + cy * b.z); g.stroke();
            }
          }
        }
      }
      for (const p of pts) {
        const x = p.x + cx * p.z, y = p.y + cy * p.z;
        if (warp > 0.05) {
          g.strokeStyle = c2 + (0.25 + 0.55 * p.z).toFixed(2) + ')';
          g.lineWidth = p.r * p.z * 1.5;
          g.beginPath(); g.moveTo(p.px + cx * p.z, p.py + cy * p.z); g.lineTo(x, y); g.stroke();
        }
        g.fillStyle = c1 + (0.35 + 0.5 * p.z).toFixed(2) + ')';
        g.beginPath(); g.arc(x, y, p.r * p.z + 0.3, 0, 6.283); g.fill();
      }
    }
    addEventListener('resize', rs);
    addEventListener('mousemove', (e) => { mx = (e.clientX / innerWidth - 0.5) * -34; my = (e.clientY / innerHeight - 0.5) * -34; });
    rs();
    requestAnimationFrame(frame);
    return {
      color(a, b) { tg = hex(a); tg2 = hex(b); },
      warp(v) { if (!U.reduced) warp = Math.max(warp, v); },
    };
  },
};

<canvas id="bg"></canvas>
<div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<div id="viewport"><div id="deck">
  <section class="slide hub-page">
    <header class="hb-head">
      <div class="hb-kicker fx fx-up"><i></i>开源图书 · 非官方动画版</div>
      <h1 class="hb-title"><span class="split" data-grad="#22d3ee,#818cf8,#c084fc">深入理解 AI Agent</span></h1>
      <p class="hb-sub fx fx-up" style="--d:9">设计原理与工程实践 · 李博杰 著 · 一章一个动画页面</p>
      <div class="hb-formula fx fx-up" style="--d:11">
        <span class="tk-a">Agent</span><span class="op">=</span>
        <span class="tk" style="--c:var(--llm)">LLM<small>大脑</small></span><span class="op">+</span>
        <span class="tk" style="--c:var(--ctx)">上下文<small>眼睛</small></span><span class="op">+</span>
        <span class="tk" style="--c:var(--tool)">工具<small>手脚</small></span>
      </div>
      <div class="hb-bar fx fx-up" style="--d:13">
        <div class="hb-stat"><b data-v="ready">0</b><span>已上线</span></div>
        <div class="hb-stat"><b data-v="all">0</b><span>篇章</span></div>
        <div class="hb-parts"></div>
        <a class="hb-resume" data-leave hidden><svg class="ic"><use href="#i-history"/></svg><span></span></a>
      </div>
    </header>
    <div class="hb-orbit fx fx-scale" style="--d:5"></div>
    <div class="hb-grid"></div>
    <footer class="hb-foot fx fx-up" style="--d:30">
      <span>非官方二次创作，内容依据 github.com/bojieli/ai-agent-book（Apache-2.0）</span>
      <span class="hb-keys"><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 选择 <kbd>Enter</kbd> 打开 <kbd>F</kbd> 全屏</span>
    </footer>
  </section>
</div></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<div id="leaveMask"></div>
<script>
/* 总目录页：章节卡片、3D 倾斜与追光、键盘选择、继续观看、跳转转场 */
(() => {
  'use strict';
  const B = window.BOOK;
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const deck = $('#deck'), page = $('.hub-page'), grid = $('.hb-grid');
  const BG = U.background($('#bg'));
  const BASE = ['#22d3ee', '#a78bfa'];

  function fit() {
    U.scale = Math.min(innerWidth / 1920, innerHeight / 1080);
    deck.style.transform = `translate(-50%,-50%) scale(${U.scale})`;
  }
  addEventListener('resize', fit);
  fit();

  $$('.split', page).forEach(U.splitChars);
  U.orbit($('.hb-orbit'), {
    size: 430, core: 'Agent', outer: 'ENVIRONMENT · 环境',
    sats: [
      { label: 'LLM', color: '#a78bfa', rx: 0.36, ry: 0.15, tilt: -24, dur: 11, phase: 0 },
      { label: '上下文', color: '#22d3ee', rx: 0.33, ry: 0.13, tilt: 34, dur: 14, phase: 0.35 },
      { label: '工具', color: '#fbbf24', rx: 0.3, ry: 0.2, tilt: 88, dur: 9, phase: 0.7 },
    ],
  });

  /* ---------- 章节卡片 ---------- */
  const tagOf = (c) => (c.part === 0 ? '构建' : c.part === 1 ? '提升' : c.no === '引言' ? '导读' : '收束');
  const bigOf = (c) => (/^第/.test(c.no) ? String(B.chapters.indexOf(c)).padStart(2, '0') : c.no === '引言' ? '00' : 'Fin');
  grid.innerHTML = B.chapters.map((c, i) => `
    <a class="hc ${c.ready ? 'ready' : 'soon'} fx fx-pop" style="--c:${c.color};--d:${10 + i}" href="${c.ready ? c.id + '.html' : '#'}" data-i="${i}">
      <div class="hc-in">
        <div class="hc-spot"></div>
        <span class="hc-big">${bigOf(c)}</span>
        <span class="hc-st">${c.ready ? '▶ 可播放' : '制作中'}</span>
        <div class="hc-orb"><svg class="ic"><use href="#i-${c.icon}"/></svg></div>
        <div class="hc-body"><div class="hc-no">${c.no}</div><b class="hc-t">${c.title}</b><p class="hc-s">${c.sub}</p></div>
        <span class="hc-tag">${tagOf(c)}</span>
      </div>
    </a>`).join('');
  const cards = $$('.hc', grid);

  $('.hb-parts').innerHTML = B.movements.map((m) => `<span style="--c:${m.color}"><i></i>${m.name}（${m.range}）</span>`).join('');
  const nReady = B.chapters.filter((c) => c.ready).length;
  U.count($('[data-v=ready]'), nReady, { dur: 1200, delay: 1400 });
  U.count($('[data-v=all]'), B.chapters.length, { dur: 1400, delay: 1500 });

  /* ---------- 继续观看 ---------- */
  try {
    const last = JSON.parse(localStorage.getItem('aab-last') || 'null');
    const ch = last && B.chapters.find((c) => c.id === last.id && c.ready);
    if (ch) {
      const a = $('.hb-resume');
      a.href = `${ch.id}.html#/${last.page}${last.step ? '/' + last.step : ''}`;
      a.querySelector('span').textContent = `继续观看 · ${ch.no} 第 ${last.page} 页${last.slide ? '：' + last.slide : ''}`;
      a.hidden = false;
    }
  } catch (e) { /* 浏览器禁用本地存储时不显示 */ }

  /* ---------- 选中、倾斜、追光 ---------- */
  let sel = -1;
  function select(i) {
    sel = i;
    cards.forEach((c, j) => c.classList.toggle('sel', j === i));
    const c = B.chapters[i];
    if (c) {
      document.body.style.setProperty('--acc', c.color);
      BG.color(c.color, c.part === 1 ? '#22d3ee' : '#a78bfa');
    }
  }
  function unselect() {
    sel = -1;
    cards.forEach((c) => c.classList.remove('sel'));
    document.body.style.setProperty('--acc', BASE[0]);
    BG.color(BASE[0], BASE[1]);
  }
  cards.forEach((card, i) => {
    const inner = card.querySelector('.hc-in');
    card.addEventListener('mouseenter', () => select(i));
    card.addEventListener('mousemove', (e) => {
      const r = inner.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      inner.style.setProperty('--mx', px * 100 + '%');
      inner.style.setProperty('--my', py * 100 + '%');
      if (!U.reduced) inner.style.transform = `perspective(900px) rotateX(${(0.5 - py) * 10}deg) rotateY(${(px - 0.5) * 12}deg) translateY(-4px)`;
    });
    card.addEventListener('mouseleave', () => { inner.style.transform = ''; unselect(); });
    card.addEventListener('click', (e) => { e.preventDefault(); open(i, e); });
  });

  /* ---------- 打开章节：未完成的章节抖一下并提示 ---------- */
  const mask = $('#leaveMask');
  function leaveTo(href, x, y) {
    if (U.reduced) { location.href = href; return; }
    mask.style.setProperty('--mx', x + 'px');
    mask.style.setProperty('--my', y + 'px');
    mask.classList.add('go');
    BG.warp(1.3);
    setTimeout(() => { location.href = href; }, 720);
  }
  function open(i, e) {
    const c = B.chapters[i], card = cards[i];
    if (!c.ready) {
      U.restart(card, 'shake');
      U.toast(`${c.no} · ${c.title}：制作中`);
      return;
    }
    U.restart(card, 'go');
    const r = card.getBoundingClientRect();
    leaveTo(card.getAttribute('href'), e && e.clientX ? e.clientX : r.left + r.width / 2, e && e.clientY ? e.clientY : r.top + r.height / 2);
  }
  $('.hb-resume').addEventListener('click', (e) => { e.preventDefault(); leaveTo(e.currentTarget.getAttribute('href'), e.clientX, e.clientY); });
  addEventListener('pageshow', () => mask.classList.remove('go'));

  /* ---------- 键盘 ---------- */
  const COLS = 4;
  addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key, n = cards.length;
    const start = sel < 0 ? B.chapters.findIndex((c) => c.ready) : sel;
    let to = -1;
    if (k === 'ArrowRight') to = sel < 0 ? start : (sel + 1) % n;
    else if (k === 'ArrowLeft') to = sel < 0 ? start : (sel - 1 + n) % n;
    else if (k === 'ArrowDown') to = sel < 0 ? start : Math.min(n - 1, sel + COLS);
    else if (k === 'ArrowUp') to = sel < 0 ? start : Math.max(0, sel - COLS);
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); open(sel < 0 ? start : sel); return; }
    else if (/^[fF]$/.test(k)) { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); return; }
    if (to >= 0) { e.preventDefault(); select(to); }
  });

  // 等两帧再激活页面，让入场动画从初始状态开始
  requestAnimationFrame(() => requestAnimationFrame(() => page.classList.add('active')));
})();

</script>
</body>
